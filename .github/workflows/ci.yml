name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Smoke-run the pipeline (offline feed, CPU)
        run: python run.py --runs 20000
      - name: Benchmark (CPU)
        run: python bench.py --nodes 500 --runs 20000
